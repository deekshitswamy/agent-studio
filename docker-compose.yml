services:
  agent-studio:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command: ["node", "server/agent-service.js"]
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
